<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Cooking Planner</title>
  <link rel="icon" type="image/x-icon" href="favicon.ico" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header>
    <h1>🍽️ My Cooking Planner</h1>
    <p>Save meals, view ingredients, and find recipes</p>
  </header>

  <main>

    <!-- Meal Plan / Weekly Planner -->
    <section class="card" id="planner-section">
      <div class="planner-header">
        <h2>Weekly Meal Plan</h2>
        <div class="planner-header-btns">
          <button id="save-plan-btn" class="save-plan-btn">💾 Save Plan</button>
          <button id="history-btn" class="history-btn">📖 History</button>
          <button id="clear-plan-btn" class="clear-btn">🗑️ Clear Plan</button>
        </div>
      </div>
      <div id="week-grid">
        <div class="week-corner"></div>
        <div class="meal-col-header">Breakfast</div>
        <div class="meal-col-header">Lunch</div>
        <div class="meal-col-header">Dinner</div>

        <div class="day-label-cell">Mon</div>
        <div class="meal-cell" data-day="Monday" data-type="Breakfast" id="cell-Monday-Breakfast"></div>
        <div class="meal-cell" data-day="Monday" data-type="Lunch" id="cell-Monday-Lunch"></div>
        <div class="meal-cell" data-day="Monday" data-type="Dinner" id="cell-Monday-Dinner"></div>

        <div class="day-label-cell">Tue</div>
        <div class="meal-cell" data-day="Tuesday" data-type="Breakfast" id="cell-Tuesday-Breakfast"></div>
        <div class="meal-cell" data-day="Tuesday" data-type="Lunch" id="cell-Tuesday-Lunch"></div>
        <div class="meal-cell" data-day="Tuesday" data-type="Dinner" id="cell-Tuesday-Dinner"></div>

        <div class="day-label-cell">Wed</div>
        <div class="meal-cell" data-day="Wednesday" data-type="Breakfast" id="cell-Wednesday-Breakfast"></div>
        <div class="meal-cell" data-day="Wednesday" data-type="Lunch" id="cell-Wednesday-Lunch"></div>
        <div class="meal-cell" data-day="Wednesday" data-type="Dinner" id="cell-Wednesday-Dinner"></div>

        <div class="day-label-cell">Thu</div>
        <div class="meal-cell" data-day="Thursday" data-type="Breakfast" id="cell-Thursday-Breakfast"></div>
        <div class="meal-cell" data-day="Thursday" data-type="Lunch" id="cell-Thursday-Lunch"></div>
        <div class="meal-cell" data-day="Thursday" data-type="Dinner" id="cell-Thursday-Dinner"></div>

        <div class="day-label-cell">Fri</div>
        <div class="meal-cell" data-day="Friday" data-type="Breakfast" id="cell-Friday-Breakfast"></div>
        <div class="meal-cell" data-day="Friday" data-type="Lunch" id="cell-Friday-Lunch"></div>
        <div class="meal-cell" data-day="Friday" data-type="Dinner" id="cell-Friday-Dinner"></div>

        <div class="day-label-cell">Sat</div>
        <div class="meal-cell" data-day="Saturday" data-type="Breakfast" id="cell-Saturday-Breakfast"></div>
        <div class="meal-cell" data-day="Saturday" data-type="Lunch" id="cell-Saturday-Lunch"></div>
        <div class="meal-cell" data-day="Saturday" data-type="Dinner" id="cell-Saturday-Dinner"></div>

        <div class="day-label-cell">Sun</div>
        <div class="meal-cell" data-day="Sunday" data-type="Breakfast" id="cell-Sunday-Breakfast"></div>
        <div class="meal-cell" data-day="Sunday" data-type="Lunch" id="cell-Sunday-Lunch"></div>
        <div class="meal-cell" data-day="Sunday" data-type="Dinner" id="cell-Sunday-Dinner"></div>
      </div>
      <button id="generate-list-btn" class="secondary-btn">📋 Generate Shopping List</button>
    </section>

    <!-- Saved Meals Library -->
    <section class="card" id="library-section">
      <div class="library-header">
        <h2>My Meals</h2>
        <div class="header-btns">
          <button id="random-btn" class="random-btn" title="Pick a random entrée">🎲 Random Entrée</button>
          <button id="sync-btn" class="sync-btn" title="Sync from Airtable">🔄 Sync from Airtable</button>
        </div>
      </div>
      <div id="sync-status"></div>
      <div class="search-row">
        <input type="text" id="search-input" placeholder="Search meals or tags..." />
        <select id="type-filter">
          <option value="">All types</option>
        </select>
      </div>
      <div id="meal-library"></div>
    </section>

  </main>

  <!-- Shopping List Modal -->
  <div id="modal-overlay" class="hidden">
    <div id="modal">
      <div id="modal-header">
        <h2>🛒 Shopping List</h2>
        <button id="modal-close">✕</button>
      </div>
      <div id="modal-body"></div>
      <div id="modal-footer">
        <button id="copy-list-btn">📋 Copy to Clipboard</button>
      </div>
    </div>
  </div>

  <!-- Ingredients / Recipe / Plan Picker Modal -->
  <div id="detail-overlay" class="hidden">
    <div id="detail-modal">
      <div id="detail-header">
        <h2 id="detail-title"></h2>
        <button id="detail-close">✕</button>
      </div>
      <div id="detail-body"></div>
    </div>
  </div>

  <script src="app.js"></script>
  <footer>
    &copy; 2026 Garrett Thompson &mdash; MIT License
  </footer>
</body>
</html>
